name: TPC Release Packaging

# ─────────────────────────────────────────────────────────────────────────────
# Trigger: GitHub Release published
#
# This workflow runs ONLY when a formal GitHub Release is published.
# It must NEVER run on push or pull_request events — the output is a source
# archive for manual submission to the TAK Product Center (TPC) third-party
# signing pipeline, and accidental runs on development commits would produce
# misleading artifacts.
# ─────────────────────────────────────────────────────────────────────────────
on:
  release:
    types: [published]

# contents: write lets the runner attach each ZIP to the GitHub Release.
permissions:
  contents: write

jobs:
  # ── Load ATAK version matrix ───────────────────────────────────────────────
  # Single source of truth for supported ATAK versions lives in
  # .github/atak-versions.json.  Add a new version there; both this workflow
  # and android.yml pick it up automatically.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: versions
        run: echo "matrix=$(cat .github/atak-versions.json)" >> "$GITHUB_OUTPUT"

  package-for-tpc:
    name: Package for TPC — ATAK ${{ matrix.atak_version }}
    runs-on: ubuntu-latest
    needs: setup

    # One ZIP per ATAK version.  Each leg produces an independent source archive
    # whose root folder name (and therefore TPC APK name) encodes both the plugin
    # release version and the target ATAK version.
    strategy:
      matrix:
        atak_version: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false   # package all versions even if one leg fails

    env:
      ATAK_VERSION: ${{ matrix.atak_version }}

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Java / Gradle setup ───────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      # ── Signing keystore ──────────────────────────────────────────────────
      # The takdev plugin generates android_keystore at configuration time when
      # the devkit repo resolves.  In CI the devkit repo is unreachable, so the
      # keystore never gets created and validateSigning fails.  Generate it here
      # with the credentials that match the release signingConfig in
      # app/build.gradle.  This keystore is only used for the compile-check APK
      # below and is discarded after the run — TPC signs with its own keys.
      - name: Generate signing keystore
        run: |
          mkdir -p app/build
          keytool -genkeypair -v \
            -keystore app/build/android_keystore \
            -alias wintec_mapping \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass tnttnt -keypass tnttnt \
            -dname "CN=ATAK Plugin Release,O=Plugin,C=US" \
            -noprompt

      # ── Release build verification ────────────────────────────────────────
      # Verifies that assembleCivRelease compiles cleanly before packaging.
      # TPC will re-run this exact Gradle task on their Gradle 6.9.1 machine
      # using their hosted maven repo for the ATAK SDK.  If the build fails
      # here it will fail at TPC too, so we catch it early.
      #
      # proguard-gradle.txt contains `-applymapping <atak.proguard.mapping>`,
      # a placeholder the takdev plugin replaces with the real ATAK mapping file
      # when resolving via the devkit repo.  In CI the devkit is unreachable, so
      # R8 receives the literal string as a filename and fails.  Strip the line
      # for this CI compile check only — the placeholder MUST be present in the
      # source ZIP so TPC's takdev plugin can replace it with the real mapping.
      # Without the mapping, R8 leaves ATAK API class names unobfuscated; those
      # original names don't exist in release ATAK, causing NoClassDefFoundError
      # at plugin load time (IServiceController, etc.).
      - name: Patch ProGuard mapping placeholder for CI compile check
        run: sed -i 's/-applymapping <atak.proguard.mapping>//' app/proguard-gradle.txt

      - name: Verify release build compiles
        run: ./gradlew assembleCivRelease

      # Restore the placeholder so the source ZIP sent to TPC contains it.
      # TPC's takdev plugin replaces <atak.proguard.mapping> with the real path
      # at build time; without it the signed APK will fail to load in release ATAK.
      - name: Restore ProGuard mapping placeholder for TPC ZIP
        run: git checkout app/proguard-gradle.txt

      # ── Source packaging ──────────────────────────────────────────────────
      # TPC packaging rules:
      #   • The ZIP must contain exactly one root folder.  That folder's name
      #     becomes the APK name produced by the TPC pipeline.
      #   • Only source files — no compiled artifacts, Gradle caches, IDE
      #     metadata, or SDK jars.
      #
      # Root folder convention: <repo>-<plugin-version>-atak<atak-version>
      #   e.g. my-plugin-0.1.0-atak5.7.0
      # This encodes both the plugin release and the target ATAK version in the
      # APK name TPC produces, making submissions unambiguous.
      #
      # Why patch build.gradle in the staged copy?
      #   ext.ATAK_VERSION defaults to 5.7.0 unless the ATAK_VERSION env var is
      #   set.  Patching the default in the staged copy makes the ZIP self-
      #   contained — TPC can run ./gradlew assembleCivRelease without needing to
      #   know which env var to set.
      #
      # Why exclude atak-sdks/?
      #   These jars are committed for local/CI builds (our takdev plugin falls
      #   back to them when the devkit repo is unreachable).  TPC runs with
      #   devkit credentials and fetches the ATAK SDK from its own maven repo,
      #   so the jars are unnecessary and would bloat the ZIP by ~100 MB.
      - name: Package source ZIP for TPC
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          REPO_NAME="${{ github.event.repository.name }}"
          ATAK_VER="${{ matrix.atak_version }}"

          # Strip the leading "v" from the tag (v0.1.1-test → 0.1.1-test).
          ZIP_NAME="${REPO_NAME}-TPC-Submission-${RELEASE_TAG}-atak${ATAK_VER}.zip"
          ROOT_FOLDER="${REPO_NAME}-${RELEASE_TAG#v}-atak${ATAK_VER}"
          STAGING_DIR="tpc-staging/${ROOT_FOLDER}"

          mkdir -p "${STAGING_DIR}"

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gradle/' \
            --exclude='.idea/' \
            --exclude='.takdev/' \
            --exclude='tpc-staging/' \
            --exclude='build/' \
            --exclude='*/build/' \
            --exclude='atak-sdks/' \
            --exclude='*.apk' \
            --exclude='*.aar' \
            --exclude='*.aab' \
            --exclude='*.zip' \
            --exclude='*.iml' \
            --exclude='*.DS_Store' \
            --exclude='.gitignore' \
            --exclude='local.properties' \
            . "${STAGING_DIR}/"

          # Hard-code this leg's ATAK version as the default so TPC can build
          # without setting an env var.
          sed -i "s/ext\.ATAK_VERSION = System\.getenv('ATAK_VERSION') ?: '[0-9.]*'/ext.ATAK_VERSION = System.getenv('ATAK_VERSION') ?: '${ATAK_VER}'/" \
            "${STAGING_DIR}/app/build.gradle"

          # Zip from inside the staging root so the archive has a single root
          # folder — a hard TPC requirement.
          cd tpc-staging
          zip -r "../${ZIP_NAME}" "${ROOT_FOLDER}/"
          cd ..

          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

          echo "=== Archive contents (top level) ==="
          unzip -l "${ZIP_NAME}" | head -40

      # ── Attach to GitHub Release ──────────────────────────────────────────
      # Primary delivery artifact.  Attach the ZIP directly to the release
      # so the team can download and submit it to TPC without navigating to
      # the Actions run.
      - name: Upload ZIP to GitHub Release
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ env.ZIP_NAME }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Workflow artifact backup ──────────────────────────────────────────
      # Retained for 14 days as a fallback if the release asset ever needs
      # to be re-downloaded or re-attached.
      #
      # IMPORTANT: always download TPC ZIPs from the GitHub Release page
      # (above), NOT from this workflow artifact.  GitHub wraps artifact
      # downloads in an extra ZIP named after the artifact — if the artifact
      # name ends in .zip the result is a nested ZIP with the same filename
      # inside.  The Release asset is the raw file with no wrapper.
      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tpc-submission-atak-${{ matrix.atak_version }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 14
