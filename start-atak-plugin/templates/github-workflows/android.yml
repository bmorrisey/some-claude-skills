name: Android CI

# ──────────────────────────────────────────────────────────────────────────────
# Triggers
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  workflow_dispatch:   # run manually from the GitHub Actions UI before merging

# Cancel any in-progress run for the same branch/PR when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ──────────────────────────────────────────────────────────────────────────────
# Build matrix
#
# ATAK plugins are distributed as debug APKs signed with the ATAK development
# keystore (generated by the takdev plugin). Production / release distribution
# requires submission through a TAK-official signing process outside this repo.
# Therefore CI builds the civDebug variant — the same artifact used for
# sideloading and all developer testing.
#
# To add a new ATAK version: drop its SDK jars into atak-sdks/<version>/ and
# add the version string to .github/atak-versions.json — that file is the single
# source of truth read by both this workflow and tak-tpc-release.yml.
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  # ── Load ATAK version matrix ───────────────────────────────────────────────
  # Single source of truth for supported ATAK versions lives in
  # .github/atak-versions.json.  Add a new version there; both this workflow
  # and tak-tpc-release.yml pick it up automatically.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: versions
        run: echo "matrix=$(cat .github/atak-versions.json)" >> "$GITHUB_OUTPUT"

  build:
    name: ATAK ${{ matrix.atak_version }}
    runs-on: ubuntu-latest
    needs: setup

    strategy:
      matrix:
        atak_version: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false             # let all matrix legs run even if one fails

    # Surface the matrix value as an env var that build.gradle reads.
    env:
      ATAK_VERSION: ${{ matrix.atak_version }}

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Java / Gradle setup ─────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # setup-gradle handles ~/.gradle caching and wrapper validation.
      # The cache key is derived from the Gradle wrapper version and build files,
      # so it is automatically invalidated when dependencies change.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      # ── Unit tests ──────────────────────────────────────────────────────────
      # Runs the JVM unit-test suite against the SDK version in the matrix cell.
      - name: Run unit tests
        run: ./gradlew testCivDebugUnitTest

      - name: Upload test report
        if: always()   # upload even on failure so failures can be inspected
        uses: actions/upload-artifact@v4
        with:
          name: test-report-atak-${{ matrix.atak_version }}
          path: app/build/reports/tests/testCivDebugUnitTest/
          retention-days: 7

      # ── Debug signing keystore ──────────────────────────────────────────────
      # The takdev plugin normally generates android_keystore at configuration
      # time, but only when the devkit repo resolves (it doesn't in CI).
      # Generate it explicitly here so validateSigningCivDebug passes.
      # Credentials match the values hardcoded in the debug signingConfig.
      - name: Generate debug signing keystore
        run: |
          mkdir -p app/build
          keytool -genkeypair -v \
            -keystore app/build/android_keystore \
            -alias wintec_mapping \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass tnttnt -keypass tnttnt \
            -dname "CN=ATAK Plugin Debug,O=Plugin,C=US" \
            -noprompt

      # ── Debug APK ───────────────────────────────────────────────────────────
      # civDebug is the sideloadable build used for all developer testing.
      # Production/release distribution goes through a TAK signing process
      # outside this repository and is not automated here.
      - name: Build debug APK
        run: ./gradlew assembleCivDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          # APK filename already embeds the ATAK version (from archivesBaseName);
          # the artifact name also carries it to avoid collisions across matrix legs.
          name: debug-apk-atak-${{ matrix.atak_version }}
          path: app/build/outputs/apk/civ/debug/*.apk
          if-no-files-found: error
          retention-days: 30
