////////////////////////////////////////////////////////////////////////////////
// Canonical app/build.gradle for an ATAK plugin (SDK 5.7+, IPlugin style).
//
// REPLACE before use:
//   • ext.PLUGIN_VERSION   (currently "0.1")
//   • android.namespace    (currently 'com.atakmap.android.MYPLUGIN.plugin')
//
// Everything else should be left alone — this file embeds all the hard-won
// fixes documented in references/01-from-scratch.md §3 and §6:
//   • ATAK_VERSION env var → multi-version CI matrix support
//   • Conditional compileOnly of in-repo SDK jar (works locally AND in TPC)
//   • dependencyLocking → OSV-Scanner can detect CVEs in resolved deps
//   • Versions hardcoded by ATAK SDK: AGP 8.9.0, Gradle 8.13, JDK 17
////////////////////////////////////////////////////////////////////////////////

buildscript {

    ext.PLUGIN_VERSION = "0.1"
    // ATAK_VERSION can be overridden via env var (used by the CI matrix build).
    // Defaults to the latest supported version for local Android Studio development.
    ext.ATAK_VERSION = System.getenv('ATAK_VERSION') ?: '5.7.0'

    def takdevVersion = '3.+'

    def getValueFromPropertiesFile = { propFile, key ->
        if(!propFile.isFile() || !propFile.canRead())
            return null
        def prop = new Properties()
        def reader = propFile.newReader()
        try {
            prop.load(reader)
        } finally {
            reader.close()
        }
        return prop.get(key)
    }

    def getProperty = { name, defValue ->
        def prop = project.properties[name] ?:
                getValueFromPropertiesFile(project.rootProject.file('local.properties'), name)
        return (null == prop) ? defValue : prop
    }

    def urlKey = 'takrepo.url'

    ext.isDevKitEnabled = { ->
        return getProperty(urlKey, null) != null
    }

    ext.takrepoUrl = getProperty(urlKey, 'https://localhost/')
    ext.takrepoUser = getProperty('takrepo.user', 'invalid')
    ext.takrepoPassword = getProperty('takrepo.password', 'invalid')
    ext.takdevPlugin = getProperty('takdev.plugin', "${rootDir}/atak-sdks/${ATAK_VERSION}/atak-gradle-takdev.jar")

    repositories {
        google()
        mavenCentral()
        mavenLocal()
        maven { url "https://jitpack.io" }
        maven {
            url = takrepoUrl
            credentials {
                username = takrepoUser
                password = takrepoPassword
            }
        }
    }
    dependencies {
        if (isDevKitEnabled()) {
            classpath "com.atakmap.gradle:atak-gradle-takdev:${takdevVersion}"
        } else {
            classpath files(takdevPlugin)
        }
    }
}

plugins {
    id("com.android.application")
    id 'org.jetbrains.kotlin.android'
}
apply {
    plugin("atak-takdev-plugin")
    // Optional helper scripts — only apply if you actually have them.
    // from("../gradle/typst.gradle")
    // from("../gradle/placeholder_icons.gradle")
    // from("../gradle/generate_launcher_icon.gradle")
}

allprojects {
    repositories {
        mavenCentral()
        google()
        mavenLocal()
        maven { url "https://jitpack.io" }
    }
}

// ISO tricodes — see https://en.wikipedia.org/wiki/List_of_ISO_3166_country_codes
def supportedFlavors =
[
    [ name : 'civ', default: true ],
    [ name : 'mil' ],
    [ name : 'gov' ],
]

android {
    compileSdk 36
    namespace 'com.atakmap.android.MYPLUGIN.plugin'   // ← REPLACE MYPLUGIN

    buildFeatures { buildConfig = true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // REQUIRED — disabling this breaks TAK's inner signing check; plugin will not load.
    bundle { storeArchive { enable = false } }

    // REQUIRED — without legacy packaging, native libs can't load.
    packagingOptions {
        jniLibs { useLegacyPackaging = true }
    }

    signingConfigs {
        debug {
            storeFile file("${buildDir}/android_keystore")
            storePassword "tnttnt"
            keyAlias "wintec_mapping"
            keyPassword "tnttnt"
        }
        release {
            storeFile file("${buildDir}/android_keystore")
            storePassword "tnttnt"
            keyAlias "wintec_mapping"
            keyPassword "tnttnt"
        }
    }

    buildTypes {
        debug {
            debuggable true
            matchingFallbacks = ['sdk']
        }
        release {
            minifyEnabled true
            proguardFiles 'proguard-gradle.txt', 'proguard-gradle-repackage.txt'
            signingConfig signingConfigs.release
            matchingFallbacks = ['odk']
        }
    }

    flavorDimensions "application"

    productFlavors {
        supportedFlavors.each { flav ->
            "${flav.name}" {
                getIsDefault().set(flav.default)
                dimension "application"

                if (!flav.name.equals("civ") && !flav.name.equals("mil")) {
                    applicationIdSuffix = ".${flav.name}"
                }
                matchingFallbacks = ['civ']

                def pluginApiFlavor = flav.name.equals('gov') ? 'CIV' : "${flav.name.toUpperCase()}"
                manifestPlaceholders = [atakApiVersion: "com.atakmap.app@" + ATAK_VERSION + ".${pluginApiFlavor}"]
            }
        }
        applicationVariants.all { variant ->
            variant.resValue "string", "versionName", variant.versionName
            buildConfigField 'String', 'ATAK_PACKAGE_NAME', '"com.atakmap.app.civ"'
        }
    }

    packagingOptions {
        resources { excludes += ['META-INF/INDEX.LIST'] }
        jniLibs.useLegacyPackaging true
    }

    sourceSets {
        main {
            // Do not modify archiveBaseName or versionCode logic — community consistency.
            setProperty("archivesBaseName", "ATAK-Plugin-" + rootProject.name + "-" + PLUGIN_VERSION + "-" + getVersionName() + "-" + ATAK_VERSION)
            defaultConfig.versionCode = getVersionCode()
            defaultConfig.versionName = PLUGIN_VERSION + " (" + getVersionName() + ") - [" + ATAK_VERSION + "]"
        }

        // Custom build-type roots — keeps src/ clean.
        debug.setRoot('build-types/debug')
        release.setRoot('build-types/release')
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34

        def runTasks = gradle.startParameter.taskNames
        if(runTasks.toString().contains('bundle')) {
            ndk { abiFilters "armeabi-v7a", "arm64-v8a" }
        } else {
            ndk { abiFilters "armeabi-v7a", "arm64-v8a", "x86" }
        }
    }
    lint { abortOnError true; checkReleaseBuilds true }
    kotlinOptions { jvmTarget = '17' }
    testOptions { unitTests { returnDefaultValues = true } }
}

afterEvaluate {
    // Auto-generated; do not edit by hand.
    project.file('proguard-gradle-repackage.txt').text = "-repackageclasses atakplugin.${rootProject.getName()}"

    try {
        tasks.named("compile" + getCommandFlavor() + "ReleaseKotlin") {
            kotlinOptions { freeCompilerArgs += "-Xsam-conversions=class" }
        }
    } catch (Exception ignored) { }
}

def getCommandFlavor() {
    String tskReqStr = getGradle().getStartParameter().getTaskRequests().toString()
    java.util.regex.Pattern pattern
    if( tskReqStr.contains( "assemble" ) )
        pattern = java.util.regex.Pattern.compile("assemble(\\w+)(Release|Debug)")
    else if( tskReqStr.contains( "install" ) )
        pattern = java.util.regex.Pattern.compile("install(\\w+)(Release|Debug)")
    else
        pattern = java.util.regex.Pattern.compile("generate(\\w+)(Release|Debug)")
    java.util.regex.Matcher matcher = pattern.matcher(tskReqStr)
    return matcher.find() ? matcher.group(1) : "Civ"
}

dependencies {
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation fileTree(dir: 'libs', include: '*.jar')

    // CRITICAL: conditional compileOnly of the in-repo SDK jar.
    // Without this in CI, every com.atakmap.* import fails because takdev's
    // flatDir fallback looks for ../../main.jar which doesn't exist in the
    // CI checkout. WITH this unconditionally, TPC's compile fails because
    // their source ZIP excludes atak-sdks/. The `if (!isDevKitEnabled())`
    // gate is the only correct shape.
    if (!isDevKitEnabled()) {
        compileOnly       files("${rootDir}/atak-sdks/${ATAK_VERSION}/main.jar")
        testImplementation files("${rootDir}/atak-sdks/${ATAK_VERSION}/main.jar")
    }

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'io.mockk:mockk:1.13.10'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit:2.0.21'
    testImplementation 'org.json:json:20231013'
}

// Version overrides — ATAK bundles many AndroidX libs; force the versions
// ATAK ships to avoid runtime ClassNotFoundException / NoSuchMethodError.
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'androidx.core' && !details.requested.name.contains('core-viewtree')) {
            details.useVersion "1.17.0"
        }
        if (details.requested.group == 'androidx.lifecycle')  { details.useVersion "2.9.4" }
        if (details.requested.group == 'androidx.fragment')   { details.useVersion "1.8.9" }
        if (details.requested.group == 'com.squareup.okhttp3') { details.useVersion "4.11.0" }
        if (details.requested.group == 'com.squareup.okio')    { details.useVersion "3.2.0"  }
        if (requested.group == 'org.jetbrains.kotlinx' && requested.name == 'kotlinx-serialization-core') {
            details.useVersion "1.7.3"
        }
    }
}

// Exclude libs that ATAK already bundles to avoid "Duplicate Class" errors.
// (Confirm against docs/dependencies.txt in your SDK install.)
configurations.implementation {
    exclude group: 'androidx.core',         module: 'core-ktx'
    exclude group: 'androidx.core',         module: 'core'
    exclude group: 'androidx.fragment',     module: 'fragment'
    exclude group: 'androidx.lifecycle',    module: 'lifecycle'
    exclude group: 'androidx.lifecycle',    module: 'lifecycle-process'
    exclude group: 'com.squareup.okhttp3',  module: 'okhttp'
    exclude group: 'com.squareup.okio',     module: 'okio'
    exclude group: 'org.jetbrains.kotlinx', module: 'kotlinx-serialization-core'
}

// Dependency locking — lets OSV-Scanner detect CVEs in resolved dependencies.
// Regenerate lockfiles after any dependency change:
//   ./gradlew :app:resolveAndLockAll --write-locks
dependencyLocking {
    lockMode = LockMode.LENIENT
    lockAllConfigurations()
}

tasks.register('resolveAndLockAll') {
    notCompatibleWithConfigurationCache('Resolves configurations at execution time')
    doFirst {
        assert gradle.startParameter.writeDependencyLocks : \
            'Run with --write-locks: ./gradlew :app:resolveAndLockAll --write-locks'
    }
    doLast {
        configurations
            .findAll { conf ->
                conf.canBeResolved &&
                !conf.name.toLowerCase().contains('androidtest')
            }
            .each { conf ->
                try {
                    conf.resolve()
                } catch (Exception e) {
                    logger.warn("Skipping lock for '${conf.name}': ${e.message}")
                }
            }
    }
}
