# Per-developer local config — DO NOT COMMIT. .gitignore excludes this file.
#
# Save as local.properties at REPO ROOT (next to settings.gradle).
#
# sdk.dir is the only required field. Point it at your Android SDK install.
# Without it, Gradle sync fails with "SDK location not found".
sdk.dir=C:\\Users\\YOU\\AppData\\Local\\Android\\Sdk

# OPTIONAL — only set when you have TAK.gov Artifactory credentials and want
# the build to resolve the ATAK API from the official devkit repo instead of
# the in-repo atak-sdks/ jars. Most local-dev work does NOT need this.
#
# When set, isDevKitEnabled() in build.gradle returns true and the build
# behaves like TPC's pipeline (skips the in-repo jar references).
#
# takrepo.url=https://artifacts.tak.gov/artifactory/maven
# takrepo.user=YOUR_TAK_USERNAME
# takrepo.password=YOUR_TAK_PASSWORD
